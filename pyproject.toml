[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchdeck"
version = "0.1.0"
description = "A Windows-first desktop download manager powered by aria2."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.9.2"]

[project.scripts]
fetchdeck = "fetchdeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]
